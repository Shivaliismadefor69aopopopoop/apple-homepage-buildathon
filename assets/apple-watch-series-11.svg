<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 760" width="620" height="760" role="img" aria-label="Apple Watch Series 11 with a sport band, front view">
  <defs>
    <linearGradient id="awCase" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#f4f4f6"/>
      <stop offset="0.24" stop-color="#d9d9de"/>
      <stop offset="0.62" stop-color="#b6b6bd"/>
      <stop offset="1" stop-color="#e4e4e8"/>
    </linearGradient>
    <linearGradient id="awBand" x1="0.15" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#f6f6f8"/>
      <stop offset="0.4" stop-color="#e2e2e7"/>
      <stop offset="0.75" stop-color="#cdcdd4"/>
      <stop offset="1" stop-color="#eaeaee"/>
    </linearGradient>
    <linearGradient id="awCrown" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efeff2"/>
      <stop offset="0.5" stop-color="#b9b9c1"/>
      <stop offset="1" stop-color="#dfdfe4"/>
    </linearGradient>
    <radialGradient id="awFace" cx="0.3" cy="0.16" r="1.1">
      <stop offset="0" stop-color="#2b8dff"/>
      <stop offset="0.38" stop-color="#1b3fd8"/>
      <stop offset="0.72" stop-color="#5b1fb0"/>
      <stop offset="1" stop-color="#12061f"/>
    </radialGradient>
    <radialGradient id="awGlow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#5f9bff" stop-opacity="0.16"/>
      <stop offset="0.7" stop-color="#a06bff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="awBlur" x="-40%" y="-160%" width="180%" height="420%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <ellipse cx="310" cy="380" rx="290" ry="330" fill="url(#awGlow)"/>
  <ellipse cx="310" cy="726" rx="190" ry="18" fill="#5f6b8f" opacity="0.12" filter="url(#awBlur)"/>

  <!-- top band -->
  <path d="M232 44 H388 Q400 44 398 60 L378 268 H242 L222 60 Q220 44 232 44 Z" fill="url(#awBand)"/>
  <path d="M242 268 H378" fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="1.4"/>
  <g opacity="0.25" stroke="#9a9aa4" stroke-width="2" stroke-linecap="round">
    <path d="M246 84 H374"/>
    <path d="M246 116 H374"/>
    <path d="M246 148 H374"/>
    <path d="M246 180 H374"/>
    <path d="M246 212 H374"/>
  </g>

  <!-- bottom band -->
  <path d="M242 508 H378 L398 716 Q400 732 388 732 H232 Q220 732 222 716 Z" fill="url(#awBand)"/>
  <path d="M242 508 H378" fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="1.4"/>
  <g opacity="0.25" stroke="#9a9aa4" stroke-width="2" stroke-linecap="round">
    <path d="M246 552 H374"/>
    <path d="M246 584 H374"/>
    <path d="M246 616 H374"/>
    <path d="M246 648 H374"/>
    <path d="M246 680 H374"/>
  </g>

  <!-- case + display -->
  <g>
    <rect x="186" y="240" width="248" height="300" rx="76" fill="url(#awCase)"/>
    <rect x="186" y="240" width="248" height="300" rx="76" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.6"/>
    <rect x="200" y="254" width="220" height="272" rx="64" fill="#04060e"/>
    <g>
      <rect x="200" y="254" width="220" height="272" rx="64" fill="url(#awFace)"/>
      <ellipse cx="256" cy="322" rx="90" ry="80" fill="#7fd0ff" opacity="0.26"/>
      <ellipse cx="368" cy="470" rx="80" ry="70" fill="#ff6fa8" opacity="0.22"/>
      <!-- activity rings -->
      <g transform="translate(310,388)" fill="none" stroke-linecap="round">
        <circle r="46" stroke="#0f0f18" stroke-opacity="0.5" stroke-width="11"/>
        <circle r="46" stroke="#ff3b6b" stroke-width="11" stroke-dasharray="200 289" transform="rotate(-90)"/>
        <circle r="32" stroke="#0f0f18" stroke-opacity="0.5" stroke-width="11"/>
        <circle r="32" stroke="#9cf14b" stroke-width="11" stroke-dasharray="126 201" transform="rotate(-90)"/>
        <circle r="18" stroke="#0f0f18" stroke-opacity="0.5" stroke-width="11"/>
        <circle r="18" stroke="#4fe3ff" stroke-width="11" stroke-dasharray="74 113" transform="rotate(-90)"/>
      </g>
      <rect x="244" y="470" width="132" height="9" rx="4.5" fill="#ffffff" opacity="0.6"/>
      <rect x="268" y="488" width="84" height="9" rx="4.5" fill="#ffffff" opacity="0.3"/>
      <!-- complications -->
      <rect x="216" y="270" width="70" height="26" rx="13" fill="#ffffff" opacity="0.16"/>
      <rect x="334" y="270" width="70" height="26" rx="13" fill="#ffffff" opacity="0.16"/>
    </g>
    <rect x="201" y="255" width="218" height="270" rx="63" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.4"/>
    <rect x="430" y="318" width="14" height="44" rx="7" fill="url(#awCrown)"/>
    <rect x="430" y="318" width="14" height="44" rx="7" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>
    <rect x="432" y="374" width="10" height="30" rx="5" fill="#c2c2c9"/>
    <circle cx="437" cy="430" r="5" fill="#ff7a3d"/>
  </g>
</svg>
