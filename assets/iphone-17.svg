    <rect x="250.8" y="110.8" width="294.4" height="634.4" rx="47.2" fill="none" stroke="url(#i17Rim)" stroke-width="1.6"/>
    <rect x="246" y="212" width="5" height="22" rx="2.5" fill="#7a97b6"/>
