    <clipPath id="i17ScreenA"><rect x="259" y="118" width="278" height="620" rx="42"/></clipPath>
    <clipPath id="i17ScreenB"><rect x="659" y="178" width="278" height="620" rx="42"/></clipPath>
  </defs>

  <ellipse cx="600" cy="450" rx="520" ry="330" fill="url(#i17Halo)"/>
  <ellipse cx="600" cy="812" rx="380" ry="20" fill="#000000" opacity="0.06" filter="url(#i17Blur)"/>

