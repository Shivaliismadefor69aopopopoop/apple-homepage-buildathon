<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" role="img" aria-label="Two iPhone 17 models, one blue and one pink, shown from the front">
  <defs>
    <linearGradient id="i17Blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfe2f5"/>
      <stop offset="0.22" stop-color="#8fb6dd"/>
      <stop offset="0.55" stop-color="#5f8fc4"/>
      <stop offset="0.8" stop-color="#476f9e"/>
      <stop offset="1" stop-color="#a8c6e4"/>
    </linearGradient>
    <linearGradient id="i17Pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbdce4"/>
      <stop offset="0.24" stop-color="#f0b3c4"/>
      <stop offset="0.58" stop-color="#dd8ba3"/>
      <stop offset="0.82" stop-color="#c2708b"/>
      <stop offset="1" stop-color="#f2c3d0"/>
    </linearGradient>
    <linearGradient id="i17Rim" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="0.3" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.4"/>
    </linearGradient>
    <radialGradient id="i17WallA" cx="0.25" cy="0.1" r="1.05">
      <stop offset="0" stop-color="#63b6ff"/>
      <stop offset="0.4" stop-color="#4f6bff"/>
      <stop offset="0.72" stop-color="#8f47e0"/>
      <stop offset="1" stop-color="#ff8a5c"/>
    </radialGradient>
    <radialGradient id="i17WallB" cx="0.3" cy="0.08" r="1.05">
      <stop offset="0" stop-color="#ffd0dd"/>
      <stop offset="0.38" stop-color="#ff85ab"/>
      <stop offset="0.7" stop-color="#a45cf0"/>
      <stop offset="1" stop-color="#4f6bff"/>
    </radialGradient>
    <radialGradient id="i17Halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5f8fff" stop-opacity="0.13"/>
      <stop offset="0.6" stop-color="#b06cff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="i17Blur" x="-40%" y="-160%" width="180%" height="420%">
