<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-label="iPad Air in landscape with an Apple Pencil attached">
  <defs>
    <linearGradient id="ipadAirBody" x1="0.05" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#dfe6ee"/>
      <stop offset="0.24" stop-color="#b9c4d1"/>
      <stop offset="0.6" stop-color="#98a5b4"/>
      <stop offset="0.86" stop-color="#c3ccd8"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="ipadAirRim" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="0.32" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="ipadAirWall" cx="0.22" cy="0.16" r="1.15">
      <stop offset="0" stop-color="#7ff0d8"/>
      <stop offset="0.34" stop-color="#4fb8f0"/>
      <stop offset="0.68" stop-color="#6a5cf0"/>
      <stop offset="1" stop-color="#f06ab0"/>
    </radialGradient>
    <linearGradient id="ipadAirSheen" x1="0.05" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="pencilBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.42" stop-color="#f0f0f3"/>
      <stop offset="0.78" stop-color="#cfcfd6"/>
      <stop offset="1" stop-color="#a9a9b2"/>
    </linearGradient>
    <radialGradient id="ipadAirGlow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#4fd0ff" stop-opacity="0.14"/>
      <stop offset="0.62" stop-color="#9f8bff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="ipadAirBlur" x="-40%" y="-160%" width="180%" height="420%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <clipPath id="ipadAirScreenClip"><rect x="194" y="164" width="812" height="556" rx="18"/></clipPath>
  </defs>

  <ellipse cx="600" cy="430" rx="560" ry="330" fill="url(#ipadAirGlow)"/>
  <ellipse cx="600" cy="772" rx="400" ry="20" fill="#5f6b8f" opacity="0.1" filter="url(#ipadAirBlur)"/>

  <!-- Apple Pencil, magnetically attached -->
  <g>
    <rect x="438" y="130" width="326" height="17" rx="8.5" fill="#050508" opacity="0.07"/>
    <rect x="430" y="112" width="342" height="17" rx="8.5" fill="url(#pencilBody)"/>
    <rect x="430" y="112" width="342" height="6" rx="3" fill="#ffffff" opacity="0.7"/>
    <path d="M742 112 V129" stroke="#b6b6bf" stroke-width="1.4"/>
    <rect x="430" y="112" width="342" height="17" rx="8.5" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1"/>
  </g>

  <!-- iPad Air -->
  <g>
    <rect x="180" y="150" width="840" height="584" rx="30" fill="url(#ipadAirBody)"/>
    <rect x="194" y="164" width="812" height="556" rx="18" fill="#05070c"/>
    <g clip-path="url(#ipadAirScreenClip)">
      <rect x="194" y="164" width="812" height="556" fill="url(#ipadAirWall)"/>
      <ellipse cx="380" cy="290" rx="240" ry="200" fill="#bff5ff" opacity="0.34"/>
      <ellipse cx="820" cy="560" rx="260" ry="200" fill="#ff8ad0" opacity="0.26"/>
      <ellipse cx="620" cy="420" rx="300" ry="220" fill="#7f6bff" opacity="0.22"/>
      <path d="M300 640 C420 470 560 610 660 430 C740 290 860 420 920 300"
            fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="10" stroke-linecap="round"/>
      <path d="M300 640 C420 470 560 610 660 430 C740 290 860 420 920 300"
            fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="22" stroke-linecap="round"/>
      <rect x="194" y="164" width="812" height="556" fill="url(#ipadAirSheen)"/>
      <!-- pencil canvas: floating tool palette -->
      <rect x="240" y="212" width="150" height="46" rx="23" fill="#ffffff" opacity="0.2"/>
      <circle cx="268" cy="235" r="10" fill="#ffffff" opacity="0.7"/>
      <circle cx="300" cy="235" r="10" fill="#ff7ab0" opacity="0.8"/>
      <circle cx="332" cy="235" r="10" fill="#4fd0ff" opacity="0.8"/>
      <circle cx="364" cy="235" r="10" fill="#9cf14b" opacity="0.8"/>
      <rect x="240" y="644" width="220" height="52" rx="26" fill="#1b1b28" opacity="0.3"/>
      <rect x="258" y="662" width="60" height="16" rx="8" fill="#ffffff" opacity="0.5"/>
      <rect x="334" y="662" width="100" height="16" rx="8" fill="#ffffff" opacity="0.24"/>
    </g>
    <rect x="194.8" y="164.8" width="810.4" height="554.4" rx="17.2" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.6"/>
    <rect x="180.8" y="150.8" width="838.4" height="582.4" rx="29.2" fill="none" stroke="url(#ipadAirRim)" stroke-width="1.6"/>
    <circle cx="222" cy="438" r="4.5" fill="#0d1424"/>
    <circle cx="222" cy="438" r="3.6" fill="none" stroke="#5b7fa8" stroke-opacity="0.4" stroke-width="0.9"/>
  </g>
</svg>
