<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" role="img" aria-label="MacBook Air in midnight, open and facing forward">
  <defs>
    <linearGradient id="mbaLid" x1="0.05" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#28364a"/>
      <stop offset="0.28" stop-color="#131c2a"/>
      <stop offset="0.62" stop-color="#0b1119"/>
      <stop offset="0.88" stop-color="#1a2433"/>
      <stop offset="1" stop-color="#2c3a50"/>
    </linearGradient>
    <linearGradient id="mbaDeck" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#2d3b52"/>
      <stop offset="0.34" stop-color="#1a2432"/>
      <stop offset="0.72" stop-color="#111925"/>
      <stop offset="1" stop-color="#2b3a51"/>
    </linearGradient>
    <linearGradient id="mbaBase" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#243247"/>
      <stop offset="0.3" stop-color="#141d2a"/>
      <stop offset="0.72" stop-color="#0d141d"/>
      <stop offset="1" stop-color="#2b3a51"/>
    </linearGradient>
    <linearGradient id="mbaRim" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.22"/>
    </linearGradient>
    <radialGradient id="mbaWall" cx="0.34" cy="0.26" r="1.15">
      <stop offset="0" stop-color="#5b7ff0"/>
      <stop offset="0.42" stop-color="#2b3ba8"/>
      <stop offset="0.74" stop-color="#2a1a6e"/>
      <stop offset="1" stop-color="#0e1030"/>
    </radialGradient>
    <radialGradient id="mbaGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5f7bff" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#8f6bff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mbaScreensheen" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.015"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="mbaBlur" x="-30%" y="-120%" width="160%" height="340%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="mbaSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <clipPath id="mbaScreenClip"><rect x="298" y="108" width="804" height="486" rx="6"/></clipPath>
  </defs>

  <!-- ambient glow behind the machine -->
  <ellipse cx="700" cy="430" rx="640" ry="380" fill="url(#mbaGlow)"/>

  <!-- lid -->
  <g>
    <rect x="272" y="82" width="856" height="538" rx="20" fill="url(#mbaLid)"/>
    <rect x="298" y="108" width="804" height="486" rx="6" fill="#05070c"/>
    <g clip-path="url(#mbaScreenClip)">
      <rect x="298" y="108" width="804" height="486" fill="url(#mbaWall)"/>
      <ellipse cx="470" cy="230" rx="230" ry="190" fill="#7fa8ff" opacity="0.22"/>
      <ellipse cx="900" cy="470" rx="260" ry="200" fill="#b06cff" opacity="0.2"/>
      <ellipse cx="1030" cy="200" rx="200" ry="160" fill="#4fd0ff" opacity="0.14"/>
      <rect x="298" y="108" width="804" height="486" fill="url(#mbaScreensheen)"/>
      <!-- desktop chrome, abstracted -->
      <rect x="298" y="108" width="804" height="26" fill="#0b1020" opacity="0.55"/>
      <rect x="318" y="118" width="52" height="6" rx="3" fill="#ffffff" opacity="0.45"/>
      <rect x="1012" y="117" width="18" height="8" rx="4" fill="#ffffff" opacity="0.32"/>
      <rect x="1040" y="117" width="18" height="8" rx="4" fill="#ffffff" opacity="0.32"/>
      <rect x="1068" y="117" width="18" height="8" rx="4" fill="#ffffff" opacity="0.32"/>
      <!-- a quiet window -->
      <rect x="380" y="196" width="420" height="250" rx="14" fill="#0d1226" opacity="0.72"/>
      <rect x="380" y="196" width="420" height="34" rx="14" fill="#ffffff" opacity="0.06"/>
      <circle cx="404" cy="213" r="4" fill="#ff6f6f" opacity="0.6"/>
      <circle cx="420" cy="213" r="4" fill="#ffd36f" opacity="0.6"/>
      <circle cx="436" cy="213" r="4" fill="#6fe39a" opacity="0.6"/>
      <rect x="406" y="262" width="170" height="9" rx="4.5" fill="#ffffff" opacity="0.28"/>
      <rect x="406" y="284" width="250" height="9" rx="4.5" fill="#ffffff" opacity="0.16"/>
      <rect x="406" y="306" width="120" height="9" rx="4.5" fill="#ffffff" opacity="0.16"/>
      <path d="M406 400 L470 352 L534 382 L598 316 L662 352 L726 292 L774 322"
            fill="none" stroke="#69d8ff" stroke-opacity="0.75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- dock -->
      <rect x="600" y="536" width="200" height="42" rx="12" fill="#ffffff" opacity="0.08"/>
      <rect x="614" y="548" width="26" height="18" rx="5" fill="#8fb6ff" opacity="0.5"/>
      <rect x="648" y="548" width="26" height="18" rx="5" fill="#ff9ec4" opacity="0.5"/>
      <rect x="682" y="548" width="26" height="18" rx="5" fill="#9ce0b4" opacity="0.5"/>
      <rect x="716" y="548" width="26" height="18" rx="5" fill="#ffd28f" opacity="0.5"/>
      <rect x="750" y="548" width="26" height="18" rx="5" fill="#c4a8ff" opacity="0.5"/>
    </g>
    <rect x="298.8" y="108.8" width="802.4" height="484.4" rx="5.2" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.6"/>
    <rect x="272.8" y="82.8" width="854.4" height="536.4" rx="19.2" fill="none" stroke="url(#mbaRim)" stroke-width="1.6"/>
    <rect x="678" y="94" width="44" height="5" rx="2.5" fill="#0a0f16" opacity="0.9"/>
  </g>

  <!-- base: hinge, keyboard well and slim front edge -->
  <g>
    <ellipse cx="700" cy="700" rx="560" ry="72" fill="#5f7bff" opacity="0.09" filter="url(#mbaSoft)"/>
    <rect x="284" y="614" width="832" height="10" rx="5" fill="#05080d"/>
    <path d="M272 622 H1128 L1196 676 Q1202 682 1194 682 H206 Q198 682 204 676 Z" fill="url(#mbaDeck)"/>
    <path d="M272 622 H1128" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.2"/>
    <path d="M436 628 H964 L1000 662 H400 Z" fill="#070c13" opacity="0.88"/>
    <path d="M436 628 H964 L1000 662 H400 Z" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
    <g opacity="0.16" stroke="#ffffff" stroke-width="1">
      <path d="M428 638 H972"/>
      <path d="M421 648 H979"/>
      <path d="M414 658 H986"/>
    </g>
    <rect x="326" y="628" width="68" height="34" rx="5" fill="#ffffff" opacity="0.045"/>
    <rect x="1006" y="628" width="68" height="34" rx="5" fill="#ffffff" opacity="0.045"/>
    <rect x="200" y="674" width="1000" height="12" rx="6" fill="#131c28"/>
    <path d="M206 675 H1194" fill="none" stroke="#ffffff" stroke-opacity="0.13" stroke-width="1.2"/>
    <rect x="648" y="672" width="104" height="12" rx="6" fill="#05080d"/>
  </g>
</svg>
