      <path d="M352 561 H848"/>
      <path d="M344 573 H856"/>
    </g>
    <rect x="130" y="592" width="940" height="12" rx="6" fill="#242429"/>
    <path d="M136 593 H1064" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.2"/>
    <rect x="548" y="590" width="104" height="12" rx="6" fill="#050507"/>
  </g>
