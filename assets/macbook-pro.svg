      <path d="M378 400 L452 344 L526 372 L600 300 L674 340 L748 268 L822 306 L906 236 L906 470 L378 470 Z"
            fill="#7ae0ff" opacity="0.08"/>
    </g>
    <rect x="222.8" y="82.8" width="754.4" height="422.4" rx="4.2" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.6"/>
    <rect x="200.8" y="60.8" width="798.4" height="468.4" rx="15.2" fill="none" stroke="url(#mbpRim)" stroke-width="1.6"/>
    <rect x="562" y="82" width="76" height="15" rx="7.5" fill="#04040a"/>
    <circle cx="600" cy="89.5" r="3" fill="#101827"/>
  </g>

  <!-- base -->
  <g>
    <ellipse cx="600" cy="620" rx="520" ry="64" fill="#7b5cff" opacity="0.1" filter="url(#mbpSoft)"/>
    <rect x="212" y="524" width="776" height="10" rx="5" fill="#050507"/>
    <path d="M200 532 H1000 L1074 594 Q1080 600 1072 600 H128 Q120 600 126 594 Z" fill="url(#mbpBase)"/>
    <path d="M200 532 H1000" fill="none" stroke="#ffffff" stroke-opacity="0.13" stroke-width="1.2"/>
    <path d="M368 538 H832 L868 580 H332 Z" fill="#08080b" opacity="0.9"/>
    <path d="M368 538 H832 L868 580 H332 Z" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
    <g opacity="0.14" stroke="#ffffff" stroke-width="1">
