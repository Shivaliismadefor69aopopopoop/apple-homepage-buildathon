<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 620" width="820" height="620" role="img" aria-label="A device being traded in for credit">
  <defs>
    <linearGradient id="tiDevice" x1="0.05" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#f3f3f6"/>
      <stop offset="0.75" stop-color="#dcdce2"/>
      <stop offset="1" stop-color="#c4c4cc"/>
    </linearGradient>
    <linearGradient id="tiScreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fc8ff"/>
      <stop offset="0.45" stop-color="#4f6bff"/>
      <stop offset="1" stop-color="#a45cf0"/>
    </linearGradient>
    <linearGradient id="tiBadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f9dff"/>
      <stop offset="0.55" stop-color="#0071e3"/>
      <stop offset="1" stop-color="#0060c0"/>
    </linearGradient>
    <radialGradient id="tiGlow" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#4f9bff" stop-opacity="0.14"/>
      <stop offset="0.7" stop-color="#8f6bff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="tiBlur" x="-40%" y="-160%" width="180%" height="420%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <ellipse cx="410" cy="310" rx="400" ry="290" fill="url(#tiGlow)"/>
  <ellipse cx="392" cy="566" rx="230" ry="16" fill="#5f6b8f" opacity="0.1" filter="url(#tiBlur)"/>

  <!-- device, tilted like a device being handed over -->
  <g transform="rotate(-7 380 320)">
    <rect x="252" y="96" width="256" height="452" rx="46" fill="url(#tiDevice)"/>
    <rect x="252" y="96" width="256" height="452" rx="46" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1.6"/>
    <rect x="262" y="106" width="236" height="432" rx="38" fill="#0b1220"/>
    <rect x="262" y="106" width="236" height="432" rx="38" fill="url(#tiScreen)" opacity="0.92"/>
    <ellipse cx="316" cy="182" rx="110" ry="96" fill="#ffffff" opacity="0.24"/>
    <ellipse cx="450" cy="470" rx="120" ry="110" fill="#ff7ac0" opacity="0.22"/>
    <rect x="262" y="106" width="236" height="200" fill="#ffffff" opacity="0.07"/>
    <rect x="352" y="120" width="56" height="18" rx="9" fill="#0b1220"/>
    <rect x="290" y="480" width="180" height="10" rx="5" fill="#ffffff" opacity="0.5"/>
    <rect x="322" y="500" width="116" height="10" rx="5" fill="#ffffff" opacity="0.28"/>
    <rect x="263" y="107" width="234" height="430" rx="37" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.4"/>
  </g>

  <!-- exchange badge -->
  <g>
    <circle cx="556" cy="418" r="76" fill="#ffffff"/>
    <circle cx="556" cy="418" r="76" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="1.4"/>
    <circle cx="556" cy="418" r="62" fill="url(#tiBadge)"/>
    <g fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round">
      <path d="M524 404 a34 34 0 0 1 30 -14 h20"/>
      <path d="M588 432 a34 34 0 0 1 -30 14 h-20"/>
    </g>
    <path d="M578 382 L600 390 L582 404 Z" fill="#ffffff"/>
    <path d="M534 454 L512 446 L530 432 Z" fill="#ffffff"/>
  </g>

  <!-- value sparks -->
  <g fill="#0071e3" opacity="0.85">
    <circle cx="700" cy="230" r="7"/>
    <circle cx="748" cy="300" r="5"/>
    <circle cx="672" cy="176" r="4"/>
  </g>
</svg>
